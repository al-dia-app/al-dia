# Publishes a release from a pushed incoming/<version> branch, then deletes the
# branch. Releases are created with the workflow's own token, so the release page
# shows github-actions instead of a person. The branch holds files/ (the
# bundles), VERSION and NOTES.md, pushed by scripts/release.sh in the private
# source repo.
name: publish
on:
  push:
    branches: ["incoming/**"]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          gh release create "v$version" files/* --repo "$GITHUB_REPOSITORY" \
            --target main --title "Al día $version" --notes-file NOTES.md
      - name: Delete the incoming branch
        if: always()
        run: git push origin --delete "$GITHUB_REF_NAME"
